server {
    listen 80;
    server_name editodo.com www.editodo.com;

    include /etc/nginx/mime.types;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Plain http goes to https, except Let's Encrypt renewals and requests Cloudflare already took over https
    set $to_https 1;
    if ($http_x_forwarded_proto = "https") { set $to_https 0; }
    if ($request_uri ~ "^/\.well-known/acme-challenge/") { set $to_https 0; }
    if ($to_https) {
        return 301 https://$host$request_uri;
    }

    # Frontend (Static Files - React Native Web Build)
    location / {
        root /var/www/editodo/client/dist; 
        index index.html;
        try_files $uri $uri/ /index.html;

        # Disable cache for index.html to ensure updates
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # Backend API (Reverse Proxy)
    location /api {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl;
    server_name editodo.com www.editodo.com;

    ssl_certificate /etc/letsencrypt/live/editodo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/editodo.com/privkey.pem;

    include /etc/nginx/mime.types;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        root /var/www/editodo/client/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    location /api {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }


}
