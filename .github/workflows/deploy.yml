name: Deploy to Server (Oracle Cloud, shared with dubuck)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies (Client)
      run: |
        cd client
        npm install
        npm run build:web

    # v1 = the previous version, frozen at the v1 tag; served at editodo.com/v1 (v1-web branch = v1 + /v1 base path)
    - name: Build v1 web
      run: |
        git fetch --depth 1 origin v1-web
        git worktree add ../v1src FETCH_HEAD
        cd ../v1src/client
        npm ci
        npx expo export --platform web --output-dir "$GITHUB_WORKSPACE/client/v1"

    # Check before copying anything, so a missing .env leaves the live site untouched
    - name: Check server/.env exists
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_KEY }}
        script: |
          test -f /var/www/editodo/server/.env || { echo "server/.env is missing on the server (see server/.env.example)"; exit 1; }
          node -e "process.exit(Number(process.versions.node.split('.')[0]) >= 18 ? 0 : 1)" || { echo "Node 18+ required on the server"; exit 1; }

    - name: Copy files via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_KEY }}
        source: "server,client/dist,client/v1,nginx.conf"  # only what the server needs (no .git, no secrets)
        target: "/var/www/editodo"
        strip_components: 0

    - name: Execute Server Commands
      uses: appleboy/ssh-action@v1.0.3
      env:
        KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        KAKAO_ADMIN_KEY: ${{ secrets.KAKAO_ADMIN_KEY }}
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_KEY }}
        envs: KAKAO_CLIENT_SECRET,KAKAO_ADMIN_KEY
        script: |
          cd /var/www/editodo/server
          # Kakao secrets come from GitHub Secrets; only written when set, so the server .env stays the source otherwise
          setenv() { [ -n "$2" ] || return 0; grep -v "^$1=" .env > .env.tmp; printf '%s=%s\n' "$1" "$2" >> .env.tmp; chmod 600 .env.tmp; mv .env.tmp .env; }
          setenv KAKAO_CLIENT_SECRET "$KAKAO_CLIENT_SECRET"
          setenv KAKAO_ADMIN_KEY "$KAKAO_ADMIN_KEY"
          npm install --omit=dev
          pm2 reload ecosystem.config.js --env production --update-env || pm2 start ecosystem.config.js --env production
          pm2 save
          sudo cp /var/www/editodo/nginx.conf /etc/nginx/conf.d/00-editodo.conf
          sudo nginx -t   # a broken config stops here instead of taking the site down
          sudo systemctl reload nginx
